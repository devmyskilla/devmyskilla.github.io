<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content=""><meta name="description" content=""><meta property="og:title" content=""><meta property="og:description" content=""><meta property="og:image" content=""><title></title>
  <link id="appFavicon" data-asset="favicon" rel="icon" type="image/png"><link id="appManifest" rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/branding.css"><link rel="stylesheet" href="css/inline-editor.css"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="site-header" id="top"><div class="container nav-inner">
    <a data-link="home" href="index.html" data-home-link class="brand"><img class="brand-logo" data-asset="brandLogo" alt=""><span><strong data-setting="siteName"></strong><small data-i18n="developedBy"></small></span></a>
    <nav class="main-nav"><a data-link="home" href="index.html" data-home-link data-i18n="navHome"></a><a href="#explore" data-i18n="navExplore"></a><a href="#categories" data-i18n="navCategories"></a><a href="#featured" data-i18n="navFeatured"></a><button class="nav-link-btn" id="navCompare" type="button" data-i18n="navCompare"></button></nav>
    <div class="nav-actions"><button class="icon-btn" id="themeToggle" type="button" data-i18n-aria-label="theme"><span data-icon="themeDark"></span></button><select id="langSwitcher" class="lang-select" data-i18n-aria-label="language"></select></div>
  </div></header>
  <main>
    <section class="hero hero-platform container reveal">
      <div class="hero-copy"><span class="eyebrow"><span class="pulse-dot"></span><span data-i18n="explorerEyebrow"></span></span><h1 data-i18n="heroTitle"></h1><p data-i18n="heroSubtitle"></p>
        <div class="hero-platform-search"><span data-icon="search" aria-hidden="true"></span><input id="heroSearchInput" type="search" autocomplete="off" data-i18n-placeholder="heroSearchPlaceholder" data-i18n-aria-label="search"><kbd>/</kbd></div>
        <div class="quick-filter-chips" id="quickFilterChips"></div>
        <div class="hero-actions"><a class="btn btn-primary" href="#explore" data-i18n="browsePlatforms"></a><button class="btn btn-soft" id="heroCompareBtn" type="button"><span data-icon="compare"></span> <span data-i18n="comparePlatforms"></span></button><button class="btn btn-soft" id="heroQuizBtn" type="button"><span data-icon="quiz"></span> <span data-i18n="quizTitle"></span></button></div>
        <div class="trust-line"><span data-icon="check"></span> <span data-i18n="trustCopy"></span></div>
      </div>
      <div class="hero-visual" aria-hidden="true"><div class="platform-cloud" id="explorePlatformCloud"><div class="hero-core"><img class="hero-brand-logo" data-asset="heroLogo" alt=""><strong data-setting="siteName"></strong><small data-i18n="tagline"></small></div></div></div>
    </section>
    <section class="stats-strip reveal"><div class="container stats-grid"><div><strong id="statPlatforms">0</strong><span data-i18n="platformCount"></span></div><div><strong id="statFree">0</strong><span data-i18n="freeCount"></span></div><div><strong id="statCert">0</strong><span data-i18n="certCount"></span></div><div><strong id="statLang">0</strong><span data-i18n="languageCount"></span></div></div></section>
    <section class="section container" id="categories"><div class="section-heading"><div><span class="section-kicker" data-i18n="categoriesEyebrow"></span><h2 data-i18n="categoriesTitle"></h2><p data-i18n="categoriesSubtitle"></p></div></div><div class="category-grid" id="categoryGrid"></div></section>
    <section class="section container featured-section" id="featured"><div class="section-heading"><div><h2 data-i18n="featuredTitle"></h2><p data-i18n="featuredSubtitle"></p></div></div><div class="featured-grid" id="featuredGrid"></div></section>
    <section class="section explore-section" id="explore"><div class="container">
      <div class="section-heading explore-heading"><div><span class="section-kicker" data-i18n="explorerEyebrow"></span><h2 data-i18n="explorerTitle"></h2><p data-i18n="explorerSubtitle"></p></div><div class="quick-actions"><button class="mini-btn" id="randomBtn" type="button"><span data-icon="random"></span> <span data-i18n="randomPlatform"></span></button><button class="mini-btn" id="pathBtn" type="button"><span data-icon="path"></span> <span data-i18n="buildPath"></span></button><button class="mini-btn" id="installBtn" type="button" hidden><span data-icon="install"></span> <span data-i18n="installApp"></span></button></div></div>
      <div class="search-shell"><span class="search-icon" data-icon="search" aria-hidden="true"></span><input id="searchInput" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder" data-i18n-aria-label="search"><kbd>/</kbd></div>
      <div class="tabs-row" role="tablist"><button class="tab-btn active" role="tab" data-tab="all" aria-selected="true" aria-controls="platformGrid" type="button"><span data-i18n="allTab"></span><b id="allBadge">0</b></button><button class="tab-btn" role="tab" data-tab="favorites" aria-selected="false" aria-controls="platformGrid" type="button" tabindex="-1"><span data-icon="favoriteOn"></span> <span data-i18n="favoritesTab"></span><b id="favBadge">0</b></button><button class="tab-btn" role="tab" data-tab="recent" aria-selected="false" aria-controls="platformGrid" type="button" tabindex="-1"><span data-icon="recent"></span> <span data-i18n="recentTab"></span><b id="recentBadge">0</b></button></div>
      <div class="controls-panel">
        <div class="filter-group"><label for="filterLang" data-i18n="filterLanguage"></label><select id="filterLang"></select></div><div class="filter-group"><label for="filterCategory" data-i18n="filterCategory"></label><select id="filterCategory"></select></div><div class="filter-group"><label for="filterPricing" data-i18n="filterPricing"></label><select id="filterPricing"></select></div><div class="filter-group"><label for="filterVerification" data-i18n="filterVerification"></label><select id="filterVerification"></select></div>
        <div class="filter-group"><label for="sortSelect" data-i18n="sortBy"></label><select id="sortSelect"><option value="recommended" data-i18n="sortRecommended"></option><option value="name" data-i18n="sortName"></option><option value="recently_verified" data-i18n="sortVerified"></option><option value="official_count" data-i18n="sortOfficialCount"></option><option value="free" data-i18n="sortFree"></option><option value="viewed" data-i18n="sortViewed"></option><option value="recent" data-i18n="sortRecent"></option></select></div>
        <div class="checks-wrap"><label class="switch-check"><input type="checkbox" id="filterFree"><span></span><em data-i18n="freeOnly"></em></label><label class="switch-check"><input type="checkbox" id="filterCert"><span></span><em data-i18n="withCertificate"></em></label></div><button id="resetFilters" class="btn-reset" type="button"><span data-icon="reset"></span> <span data-i18n="reset"></span></button>
      </div>
      <div class="results-bar"><div><strong id="resultsCount">0</strong> <span data-i18n="platformsAvailable"></span></div></div><section class="platform-grid" id="platformGrid" aria-live="polite"><div class="loading" data-i18n="loading"></div></section>
    </div></section>
  </main>
  <aside class="compare-dock" id="compareDock" aria-live="polite"><div><strong data-i18n="compareBar"></strong><span id="compareNames"></span></div><div class="compare-dock-actions"><button class="link-btn" id="clearCompare" type="button" data-i18n="clear"></button><button class="btn btn-primary small" id="compareNow" type="button"><span data-i18n="compareNow"></span> <span id="compareCount">0/3</span></button></div></aside>
  <div class="modal" id="quizModal" role="dialog" aria-modal="true" aria-labelledby="quizTitle" aria-hidden="true"><div class="modal-card modal-medium"><button class="modal-close" data-close="quizModal" type="button" data-i18n-aria-label="close"><span data-icon="close"></span></button><h2 id="quizTitle" data-i18n="quizTitle"></h2><p class="modal-sub" data-i18n="quizSubtitle"></p><div id="quizForm"></div><div id="quizResults"></div></div></div>
  <div class="modal" id="compareModal" role="dialog" aria-modal="true" aria-labelledby="compareTitle" aria-hidden="true"><div class="modal-card modal-large"><button class="modal-close" data-close="compareModal" type="button" data-i18n-aria-label="close"><span data-icon="close"></span></button><h2 id="compareTitle" data-i18n="compareTitle"></h2><div class="table-scroll" id="compareTable"></div></div></div>
  <div class="modal" id="pathModal" role="dialog" aria-modal="true" aria-labelledby="pathTitle" aria-hidden="true"><div class="modal-card modal-large"><button class="modal-close" data-close="pathModal" type="button" data-i18n-aria-label="close"><span data-icon="close"></span></button><h2 id="pathTitle" data-i18n="pathTitle"></h2><p class="modal-sub" data-i18n="pathSubtitle"></p><div id="pathBuilder"></div><div id="pathResults"></div></div></div>
  <div class="toast" id="toast" role="status"></div>
  <footer class="site-footer"><div class="container footer-grid"><div><strong data-setting="siteName"></strong><p data-i18n="tagline"></p></div><div class="footer-developer"><span data-icon="developer"></span><div><small data-i18n="developedBy"></small><strong data-setting="developerName"></strong></div></div><p data-setting="copyright"></p></div></footer>
  <script src="js/content-api.js"></script><script src="js/edit-descriptors.js"></script><script src="js/inline-editor-config.js"></script><script src="js/inline-editor-api.js"></script><script src="js/inline-editor.js"></script><script src="js/i18n.js"></script><script src="js/site-runtime.js"></script><script src="js/platform-core.js"></script><script src="js/data-loader.js"></script><script src="js/platform-directory.js"></script><script src="js/app.js"></script><script src="js/accessibility.js"></script><script src="js/explore-nav.js"></script>
</body></html>
