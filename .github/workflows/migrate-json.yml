name: Migrate content to JSON

on:
  push:
    branches:
      - feat/json-decap-cms

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/json-decap-cms
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate data.json
        run: node scripts/migrate-data-json.cjs
      - name: Commit generated JSON
        shell: bash
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: include landing copy in data.json"
          git push origin HEAD:feat/json-decap-cms
