name: Apply JSON runtime switch

on:
  push:
    branches:
      - feat/json-decap-cms

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/json-decap-cms
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/switch-html-to-json.cjs
      - name: Commit runtime switch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make JSON the browser content source"
          git push origin HEAD:feat/json-decap-cms
