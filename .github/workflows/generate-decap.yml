name: Generate Decap configuration

on:
  push:
    branches:
      - feat/json-decap-cms

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/json-decap-cms
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-decap-config.cjs
      - name: Commit generated config
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/config.yml
          git commit -m "feat: generate Decap CMS configuration"
          git push origin HEAD:feat/json-decap-cms
