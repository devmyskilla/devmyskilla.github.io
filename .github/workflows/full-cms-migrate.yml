name: Apply full CMS migration

on:
  push:
    branches:
      - feat/full-cms-control
    paths:
      - scripts/migrate-full-cms-data.cjs
      - scripts/augment-full-cms-data.cjs
      - scripts/generate-decap-config.cjs
      - .github/workflows/full-cms-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-cms-control
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic migration and augmentation
        run: |
          node scripts/migrate-full-cms-data.cjs
          node scripts/augment-full-cms-data.cjs
      - name: Regenerate Decap config when supported
        run: |
          if node scripts/generate-decap-config.cjs; then
            echo "Decap configuration regenerated"
          else
            echo "Decap generator is not compatible with the full schema yet"
          fi
      - name: Commit generated content
        run: |
          if git diff --quiet -- data.json admin/config.yml; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json admin/config.yml
          git commit -m "chore: refresh generated CMS content"
          git push origin HEAD:feat/full-cms-control
