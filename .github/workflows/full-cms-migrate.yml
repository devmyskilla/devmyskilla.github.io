name: Apply full CMS migration

on:
  push:
    branches:
      - feat/full-cms-control
    paths:
      - scripts/migrate-full-cms-data.cjs
      - .github/workflows/full-cms-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-cms-control
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic migration
        run: node scripts/migrate-full-cms-data.cjs
      - name: Commit generated data
        run: |
          if git diff --quiet -- data.json; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: apply full CMS data migration"
          git push origin HEAD:feat/full-cms-control
