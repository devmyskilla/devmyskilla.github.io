name: Repair inline editor baseline

on:
  push:
    branches:
      - feat/inline-site-editor
    paths:
      - .github/workflows/repair-inline-baseline.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inline-site-editor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair malformed combined language references
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const data=JSON.parse(fs.readFileSync('data.json','utf8'));
          const replacements={ArabicEnglish:['Arabic','English'],EnglishArabic:['English','Arabic']};
          let changed=0;
          for(const row of data.platforms||[]){
            const next=[];
            for(const id of row.languageIds||[]){
              const parts=replacements[id]||[id];
              for(const part of parts) if(!next.includes(part)) next.push(part);
            }
            if(JSON.stringify(next)!==JSON.stringify(row.languageIds||[])){row.languageIds=next;changed++;}
          }
          if(!changed) throw new Error('Expected at least one malformed combined language reference');
          fs.writeFileSync('data.json',JSON.stringify(data,null,2)+'\n');
          console.log(`Repaired ${changed} platform language reference(s)`);
          NODE
          node scripts/validate-content.cjs
      - name: Commit repaired data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "fix: repair malformed language references"
          git push origin HEAD:feat/inline-site-editor
