name: Repair inline editor baseline

on:
  push:
    branches:
      - feat/inline-site-editor
    paths:
      - .github/workflows/repair-inline-baseline.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/inline-site-editor
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair the malformed Microsoft language reference
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const data=JSON.parse(fs.readFileSync('data.json','utf8'));
          const row=data.platforms.find(p=>p.id==='plat-5');
          if(!row) throw new Error('plat-5 missing');
          if(JSON.stringify(row.languageIds)===JSON.stringify(['ArabicEnglish'])) row.languageIds=['Arabic','English'];
          fs.writeFileSync('data.json',JSON.stringify(data,null,2)+'\n');
          NODE
          node scripts/validate-content.cjs
      - name: Commit repaired data
        run: |
          if git diff --quiet -- data.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "fix: repair Microsoft language references"
          git push origin HEAD:feat/inline-site-editor
