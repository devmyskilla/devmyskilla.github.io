name: Deploy inline editor Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create temporary Worker secret file
        shell: bash
        run: |
          umask 077
          printf '%s\n' \
            "GITHUB_OAUTH_ID=${{ secrets.GITHUB_OAUTH_ID }}" \
            "GITHUB_OAUTH_SECRET=${{ secrets.GITHUB_OAUTH_SECRET }}" \
            > inline-worker/.deploy-secrets.env
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.97.0 deploy --config inline-worker/wrangler.toml --secrets-file inline-worker/.deploy-secrets.env
      - name: Remove temporary Worker secret file
        if: always()
        run: rm -f inline-worker/.deploy-secrets.env
