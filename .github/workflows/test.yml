name: Test platform directory

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic inline integration patch
        if: github.event_name == 'push' && github.ref_name == 'feat/inline-site-editor' && github.event.head_commit.message == 'chore: trigger deterministic inline integration'
        run: node scripts/patch-inline-app.cjs
      - name: Run unit and architecture tests
        run: node --test tests/*.test.cjs
      - name: Check JavaScript syntax
        run: |
          for f in js/*.js scripts/*.cjs; do node --check "$f"; done
      - name: Validate full CMS content
        run: node scripts/validate-content.cjs
      - name: Verify Decap configuration matches data.json
        run: node scripts/generate-decap-config.cjs --check
      - name: Prevent legacy Supabase runtime dependencies
        run: |
          if grep -RniE 'SUPABASE_CONFIG|PlatformData|supabase-config\.js|platform-data\.js' index.html explore.html platform.html js admin; then
            echo 'Legacy Supabase runtime reference detected'
            exit 1
          fi
      - name: Run git diff --check
        run: git diff --check
      - name: Commit deterministic inline integration
        if: github.event_name == 'push' && github.ref_name == 'feat/inline-site-editor' && github.event.head_commit.message == 'chore: trigger deterministic inline integration'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/platform-detail.js
          git commit -m "feat: integrate inline editor into explorer content"
          git push origin HEAD:feat/inline-site-editor
