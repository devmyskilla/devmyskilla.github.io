name: Test platform directory

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.cjs
      - run: |
          for f in js/*.js; do node --check "$f"; done
      - name: Verify generated platform seed
        run: |
          node scripts/build-platform-seed.mjs > /tmp/platform-directory-seed.sql
          diff -u supabase/platform-directory-seed.sql /tmp/platform-directory-seed.sql
      - name: Verify public Supabase platform REST access
        env:
          SUPABASE_URL: https://pptjaflkltwavyktzphw.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_lUq2yPmkTijaqyYDifTYFA_Es-Xi7Nb
        run: |
          curl --fail-with-body --silent --show-error \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Accept: application/json" \
            "$SUPABASE_URL/rest/v1/platforms?select=external_id,status,category,languages,featured,display_order&status=eq.active&order=id.asc" \
            -o /tmp/platforms.json
          node - <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/platforms.json','utf8'));
          if (!Array.isArray(rows)) throw new Error('Supabase response is not an array');
          if (rows.length !== 40) throw new Error(`Expected 40 active platforms, received ${rows.length}`);
          if (rows.some(row => row.status !== 'active')) throw new Error('Public response exposed a non-active platform');
          if (rows.some(row => !/^plat-\d+$/.test(row.external_id || ''))) throw new Error('Public response contains an invalid external_id');
          console.log(`Verified ${rows.length} active public platforms from Supabase REST`);
          NODE
      - run: git diff --check
