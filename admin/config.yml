backend:
  name: github
  repo: devmyskilla/devmyskilla.github.io
  branch: main
  base_url: https://dunya-decap-oauth.atomy8774.workers.dev
  auth_endpoint: auth
  # After deploying your OAuth proxy, uncomment and replace the next line.
  # base_url: https://YOUR-OAUTH-PROXY.example.com
  # auth_endpoint: auth

site_url: https://devmyskilla.github.io
logo_url: https://devmyskilla.github.io/assets/dunya-logo-192.png
publish_mode: simple
media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - label: "بيانات دنيا الدورات"
    name: site_data
    files:
      - label: "النصوص والمنصات"
        name: site_data
        file: data.json
        fields:
          - label: "نصوص الموقع"
            name: siteText
            widget: object
            collapsed: true
            fields:
              - label: "العربية"
                name: "ar"
                widget: object
                collapsed: true
                fields:

              - label: "English"
                name: "en"
                widget: object
                collapsed: true
                fields:

              - label: "Türkçe"
                name: "tr"
                widget: object
                collapsed: true
                fields:

          - label: "المنصات"
            name: platforms
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: "ID", name: id, widget: string }
              - { label: "اسم المنصة", name: name, widget: string }
              - { label: "الوصف العربي", name: description_ar, widget: text, required: false }
              - { label: "English description", name: description_en, widget: text, required: false }
              - { label: "Türkçe açıklama", name: description_tr, widget: text, required: false }
              - { label: "التصنيف", name: category, widget: string }
              - label: "حالة السعر"
                name: pricingModel
                widget: select
                options:
                  - { label: "مجاني", value: free }
                  - { label: "مجاني جزئيًا", value: freemium }
                  - { label: "مدفوع", value: paid }
                  - { label: "مختلط", value: mixed }
              - { label: "يوفر محتوى مجاني", name: hasFreeContent, widget: boolean, default: false }
              - { label: "يوفر شهادات", name: certificateAvailable, widget: boolean, default: false }
              - { label: "الشهادات مجانية", name: freeCertificate, widget: boolean, default: false }
              - label: "اللغات"
                name: languages
                widget: list
                required: false
                field: { label: "اللغة", name: "value", widget: string }
              - { label: "نوع المنصة", name: platformType, widget: string, required: false }
              - { label: "الموقع الرسمي", name: officialUrl, widget: string, required: false }
              - { label: "رابط الكتالوج", name: catalogUrl, widget: string, required: false }
              - { label: "رابط الشعار", name: logoUrl, widget: string, required: false }
              - { label: "عدد المحتوى الرسمي", name: officialCount, widget: number, value_type: int, required: false }
              - label: "نوع العدد الرسمي"
                name: officialCountType
                widget: select
                required: false
                options:
                  - { label: courses, value: courses }
                  - { label: modules, value: modules }
                  - { label: learning_paths, value: learning_paths }
                  - { label: job_simulations, value: job_simulations }
                  - { label: certifications, value: certifications }
                  - { label: materials, value: materials }
                  - { label: items, value: items }
              - { label: "آخر تحقق", name: lastVerified, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false }
              - label: "مناسب لـ — عربي"
                name: "best_for_ar"
                widget: list
                required: false
                field: { label: "Value", name: "value", widget: string }
              - label: "Best for — English"
                name: "best_for_en"
                widget: list
                required: false
                field: { label: "Value", name: "value", widget: string }
              - label: "Uygun — Türkçe"
                name: "best_for_tr"
                widget: list
                required: false
                field: { label: "Value", name: "value", widget: string }
              - label: "نقاط القوة — عربي"
                name: "strengths_ar"
                widget: list
                required: false
                field: { label: "Value", name: "value", widget: string }
              - label: "Strengths — English"
                name: "strengths_en"
                widget: list
                required: false
                field: { label: "Value", name: "value", widget: string }
              - label: "Güçlü yönler — Türkçe"
                name: "strengths_tr"
                widget: list
                required: false
                field: { label: "Value", name: "value", widget: string }
              - label: "القيود — عربي"
                name: "limitations_ar"
                widget: list
                required: false
                field: { label: "Value", name: "value", widget: string }
              - label: "Limitations — English"
                name: "limitations_en"
                widget: list
                required: false
                field: { label: "Value", name: "value", widget: string }
              - label: "Sınırlamalar — Türkçe"
                name: "limitations_tr"
                widget: list
                required: false
                field: { label: "Value", name: "value", widget: string }
              - { label: "منصة مميزة", name: featured, widget: boolean, default: false }
              - { label: "ترتيب العرض", name: displayOrder, widget: number, value_type: int, required: false }
